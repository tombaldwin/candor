name: integrations

# Gates the umbrella repo's integration surfaces — the Claude Code edit-time loop and the PR-native
# gate reporter — so their contracts can't regress silently. Both test suites are hermetic (mock
# review / mock `path` query; no engine, no network), so this is fast and needs no sibling checkouts.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  integration-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      # jsonschema powers the SARIF 2.1.0 schema-validation gate in test-candor-sarif.sh (it skips
      # gracefully if absent, but in CI we want it to actually run). jq is preinstalled on the runner.
      - name: Install jsonschema
        run: python -m pip install --quiet jsonschema

      - name: candor-sarif parses
        run: python -c "import ast; ast.parse(open('integrations/github/candor-sarif').read())"

      - name: Stop-hook contract (Claude Code edit-time loop)
        run: bash integrations/claude-code/test-stop-hook.sh

      - name: candor-sarif contract + SARIF 2.1.0 schema validation
        run: bash integrations/github/test-candor-sarif.sh

      - name: candor-init parses
        run: python -c "import ast; ast.parse(open('adopt/candor-init').read())"

      - name: candor-init policy-inference contract
        run: bash adopt/test-candor-init.sh

      - name: candor-init.sh one-command scaffolder contract
        run: bash adopt/test-candor-init-sh.sh

  # The JetBrains plugin (integrations/jetbrains) — compile + package so the thin client can't rot
  # while it iterates toward the Marketplace. The IntelliJ SDK (~1GB) is cached by setup-gradle; the
  # first run is slow, the steady state ~3 min. Node is needed by the bundleServer task (npm+esbuild).
  jetbrains-plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build the plugin (compile + embed server bundle + engine jar + package)
        working-directory: integrations/jetbrains
        run: gradle buildPlugin --no-daemon
      - name: The packaged zip embeds both artifacts
        working-directory: integrations/jetbrains
        run: |
          unzip -p build/distributions/candor-intellij-*.zip 'candor-intellij/lib/candor-intellij-*.jar' > /tmp/inner.jar
          unzip -l /tmp/inner.jar | grep -q 'server/candor-lsp.mjs' || { echo 'FAIL: server bundle missing'; exit 1; }
          unzip -l /tmp/inner.jar | grep -q 'engine/candor-java-all.jar' || { echo 'FAIL: engine jar missing'; exit 1; }
          echo 'both embedded artifacts present'
