name: integrations

# Gates the umbrella repo's integration surfaces — the Claude Code edit-time loop, the PR-native
# gate reporter, the adopt scaffolder, and the fingerprint — so their contracts can't regress
# silently. All suites are hermetic (mock review / mock `path` query; no engine, no network), so this
# is fast and needs no sibling checkouts. Path-filtered to the surfaces it gates (the JetBrains
# plugin has its own workflow — jetbrains.yml — with the heavy IntelliJ SDK build).
on:
  push:
    branches: [main]
    paths:
      - 'adopt/**'
      - 'integrations/github/**'
      - 'integrations/claude-code/**'
      - 'fingerprint/**'
      - 'bin/**'
      - '.github/workflows/integrations.yml'
  pull_request:
    paths:
      - 'adopt/**'
      - 'integrations/github/**'
      - 'integrations/claude-code/**'
      - 'fingerprint/**'
      - 'bin/**'
      - '.github/workflows/integrations.yml'

jobs:
  integration-tests:
    runs-on: ubuntu-latest
    # A deadline. With no `timeout-minutes` GitHub's 6-hour default applies, so a stuck runner
    # blocks the release gate (release-preflight [10] reads CI green on HEAD) while looking
    # exactly like a slow job — measured twice on 2026-08-19, at 3h45m and 54m. Gated by
    # release-preflight [7b], which asks every workflow in every released repo.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      # jsonschema powers the SARIF 2.1.0 schema-validation gate in test-candor-sarif.sh (it skips
      # gracefully if absent, but in CI we want it to actually run). jq is preinstalled on the runner.
      - name: Install jsonschema
        run: python -m pip install --quiet jsonschema

      - name: candor-sarif parses
        run: python -c "import ast; ast.parse(open('integrations/github/candor-sarif').read())"

      - name: Stop-hook contract (Claude Code edit-time loop)
        run: bash integrations/claude-code/test-stop-hook.sh

      - name: candor-sarif contract + SARIF 2.1.0 schema validation
        run: bash integrations/github/test-candor-sarif.sh

      - name: candor-init parses
        run: python -c "import ast; ast.parse(open('adopt/candor-init').read())"

      - name: candor-init policy-inference contract
        run: bash adopt/test-candor-init.sh

      - name: candor-init.sh one-command scaffolder contract
        run: bash adopt/test-candor-init-sh.sh

      # node + jq are preinstalled on the runner; the test is SVG/JSON only (no rasterizer).
      - name: fingerprint determinism + metadata contract
        run: bash fingerprint/test-fingerprint.sh

      # The `candor` dispatcher's routing (query→backend, scan→manifest, loud on ambiguity/missing engine).
      # Hermetic: CANDOR_DISPATCH_DRYRUN + fake engine stubs, no siblings or network.
      - name: candor dispatcher routing contract
        run: bash bin/candor.test.sh

      # The shared corpus A/B (SOUNDNESS R288/R242/R289).  Its selftest is the CALIBRATION, not a
      # smoke test: it proves the tool reports a LARGER changed count than the `fn`-keyed version it
      # replaces, REFUSES an entry that judged nothing, catches a change an `inferred`-only key
      # misses, and returns zero on identical inputs.  An instrument nobody has watched fail is not
      # an instrument, and this one's failure mode — an empty diff — is the answer everybody wants.
      # Hermetic: the arms are `cat` over fixture JSON, so no engine and no corpus are needed.
      # It runs `corpus-ab.py --selftest` first, then the things an in-process selftest cannot reach:
      # the EXIT CODES a caller reads (3 = no comparison, 4 = not evidence), and the contract with
      # `bin/corpus.sh --hollow-check`, the R242 authority the A/B asks instead of copying.
      - name: corpus A/B differential calibration
        run: bash bin/corpus-ab.test.sh

