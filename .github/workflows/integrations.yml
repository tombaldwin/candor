name: integrations

# Gates the umbrella repo's integration surfaces — the Claude Code edit-time loop, the PR-native
# gate reporter, the adopt scaffolder, and the fingerprint — so their contracts can't regress
# silently. All suites are hermetic (mock review / mock `path` query; no engine, no network), so this
# is fast and needs no sibling checkouts. Path-filtered to the surfaces it gates (the JetBrains
# plugin has its own workflow — jetbrains.yml — with the heavy IntelliJ SDK build).
on:
  push:
    branches: [main]
    paths:
      - 'adopt/**'
      - 'integrations/github/**'
      - 'integrations/claude-code/**'
      - 'fingerprint/**'
      - '.github/workflows/integrations.yml'
  pull_request:
    paths:
      - 'adopt/**'
      - 'integrations/github/**'
      - 'integrations/claude-code/**'
      - 'fingerprint/**'
      - '.github/workflows/integrations.yml'

jobs:
  integration-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      # jsonschema powers the SARIF 2.1.0 schema-validation gate in test-candor-sarif.sh (it skips
      # gracefully if absent, but in CI we want it to actually run). jq is preinstalled on the runner.
      - name: Install jsonschema
        run: python -m pip install --quiet jsonschema

      - name: candor-sarif parses
        run: python -c "import ast; ast.parse(open('integrations/github/candor-sarif').read())"

      - name: Stop-hook contract (Claude Code edit-time loop)
        run: bash integrations/claude-code/test-stop-hook.sh

      - name: candor-sarif contract + SARIF 2.1.0 schema validation
        run: bash integrations/github/test-candor-sarif.sh

      - name: candor-init parses
        run: python -c "import ast; ast.parse(open('adopt/candor-init').read())"

      - name: candor-init policy-inference contract
        run: bash adopt/test-candor-init.sh

      - name: candor-init.sh one-command scaffolder contract
        run: bash adopt/test-candor-init-sh.sh

      # node + jq are preinstalled on the runner; the test is SVG/JSON only (no rasterizer).
      - name: fingerprint determinism + metadata contract
        run: bash fingerprint/test-fingerprint.sh

