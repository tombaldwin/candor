name: release-scripts

# THE RELEASE SCRIPTS ARE THE ONLY THING IN THE FAMILY THAT WAS TESTED BY PUBLISHING.
#
# `release-stage.sh` performs ~19 edits across six repos, `release-preflight.sh` carries eleven checks, and
# `release.sh` stands between all of that and crates.io, npm and seven GitHub releases. Nothing gated any of
# them — and NINE defects across the 0.25 and 0.26 cuts were found by RUNNING them, not one by reading. Two
# of the nine would have shipped a bad release: empty GitHub release notes for all five engines, and a brew
# umbrella pinned to the previous engine line.
#
# `bin/release-test.sh` runs the stager against a throwaway fixture tree of six stub repos and asserts on
# the result, so that class is caught here instead of at publish time.
#
# WHAT THIS CANNOT COVER, stated so a green tick is not read as more than it is: the publish calls
# themselves — `cargo publish`, the npm OIDC tag, `gh release create`, the Homebrew tap. They touch the
# network and there is no dry-run mode yet. Eight of the nine defects are on this side of that line, and
# the remaining exposure is the publish sequence, which is still only exercised by a real release.
#
# A MONITOR VS A GATE: `release-audit.yml` asks on a schedule whether the PUBLISHED world still matches the
# pins. This asks on push whether the scripts still behave. Different questions, deliberately separate jobs.

on:
  push:
    branches: [main]
    paths: ['bin/**', 'scripts/**', '.github/workflows/release-scripts.yml']
  pull_request:
    paths: ['bin/**', 'scripts/**', '.github/workflows/release-scripts.yml']
  workflow_dispatch:

concurrency:
  group: release-scripts-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    # A deadline. With no `timeout-minutes` GitHub's 6-hour default applies, so a stuck runner
    # blocks the release gate (release-preflight [10] reads CI green on HEAD) while looking
    # exactly like a slow job — measured twice on 2026-08-19, at 3h45m and 54m. Gated by
    # release-preflight [7b], which asks every workflow in every released repo.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # The fixture is built in a mktemp dir and torn down on exit; nothing outside it is touched, and no
      # network call is made. That is what makes this runnable on every push rather than once per release.
      - name: release-test (fixture tree)
        run: bash bin/release-test.sh

      # Cheap, and it has already paid: a heredoc nested inside `$(...)` was one of the 0.25 defects, and
      # `bash -n` catches exactly that shape before anyone runs the script for real.
      #
      # AND IT WAS VACUOUS UNTIL 2026-08-25 — MEASURED, not suspected. The loop body was
      # `bash -n "$f" && echo "  ok  $f"`, and `set -e` (GitHub's default shell is `bash -e {0}`)
      # explicitly does NOT fire for a command on the LEFT of `&&`. So a parse error printed its message,
      # the loop carried on, and the step's exit status was the LAST command's — the python3 line, which
      # passed. An unterminated `if` planted in `bin/changelog-lag.sh` produced
      # `syntax error: unexpected end of file` on stdout and STEP EXIT CODE: 0. The one gate whose whole
      # job is to notice a parse error could not fail on one.
      #
      # It now collects every failure and exits on the count, so N broken scripts are one run, not N.
      - name: parse every release script
        run: |
          # `bin/changelog-lag.sh` and `adopt/candor-run` are named explicitly: neither matches
          # `bin/release*.sh`, and `adopt/candor-run` is a TEMPLATE shipped into consumer repos, so a
          # parse error in it breaks someone else's CI rather than ours. It carries @KIND@ placeholders,
          # which are inert to the parser (they sit inside double quotes).
          bad=0
          for f in bin/release*.sh bin/changelog-lag.sh scripts/update-candor.sh bin/candor adopt/candor-run; do
            [ -f "$f" ] || continue
            if bash -n "$f"; then echo "  ok  $f"; else echo "  ✘ PARSE ERROR  $f"; bad=$((bad + 1)); fi
          done
          if python3 -c "import ast,sys; ast.parse(open('bin/_stage_changelogs.py').read())"
          then echo "  ok  bin/_stage_changelogs.py"
          else echo "  ✘ PARSE ERROR  bin/_stage_changelogs.py"; bad=$((bad + 1)); fi
          [ "$bad" = 0 ] || { echo "parse: $bad file(s) do not parse"; exit 1; }
