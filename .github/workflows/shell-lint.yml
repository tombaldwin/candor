# Lint the release machinery.
#
# WHY THIS EXISTS, precisely. `release.sh`'s step-7 refusal — the message an operator is GUARANTEED to
# read, because that step refuses on every release's first pass by design — was written with filenames
# in backticks inside a double-quoted string. Backticks there are live command substitution, so it
# printed "CHANGELOG. ,  and jbang-catalog.json all count as SOURCE", silently deleting the three names
# the sentence exists to give. `bash -n` passed: it is valid syntax, just not the intended semantics.
# ShellCheck flags exactly this (SC2006/SC2016 family), which is cheaper than the assertion that now
# guards the one instance.
name: shell-lint
on:
  push:
    paths: ['bin/**', '.github/workflows/shell-lint.yml', 'justfile']
  pull_request:
    paths: ['bin/**', '.github/workflows/shell-lint.yml', 'justfile']

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    # A deadline. With no `timeout-minutes` GitHub's 6-hour default applies, so a stuck runner
    # blocks the release gate (release-preflight [10] reads CI green on HEAD) while looking
    # exactly like a slow job — measured twice on 2026-08-19, at 3h45m and 54m. Gated by
    # release-preflight [7b], which asks every workflow in every released repo.
    #
    # 30 -> 10 on 2026-08-19, after this job hung for 30 minutes and the deadline killed it (working as
    # intended, but a 30-minute wait to learn that). Its successful runs take 16-22 seconds.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        # ubuntu-latest ships shellcheck; the apt path is a FALLBACK, not the normal route. The
        # unconditional `apt-get update && install` this replaces was the only step here that touched
        # the network, and on 2026-08-19 it hung for the job's entire budget — half an hour spent
        # installing a tool that was already on the box, on a job whose whole life is 18 seconds. A step
        # deadline as well, so a hang costs a minute rather than the job.
        timeout-minutes: 5
        run: |
          command -v shellcheck >/dev/null \
            || { sudo apt-get update -qq && sudo apt-get install -y shellcheck; }
          shellcheck --version
      - name: lint bin/
        # -S warning, not the default: the release scripts are long-lived and deliberately idiomatic in
        # places (word-splitting a built command array, for one), so `info`-level noise would train the
        # next person to ignore the run. Warnings and errors only, and they must be zero.
        run: shellcheck -S warning bin/*.sh
