# The IntelliJ Platform Gradle Plugin (2.x) resolves the IDE SDK + the LSP4IJ marketplace plugin at build
# time — the first build downloads ~1GB. Target IC (Community) so the LSP4IJ route covers every edition.
platformType=IC
platformVersion=2024.3
lsp4ijVersion=com.redhat.devtools.lsp4ij:0.20.1
pluginVersion=0.12.0
# The two bundled-toolchain pins (embedded by fetchEngineJar / stageServer; both are build-task inputs,
# so bumping either re-stages — a pin bump can never ship a stale embed).
# VERSIONING: the plugin's major.minor tracks the candor-spec version of its bundled toolchain
# (the family rule, SPEC §2.1) — 0.8.x ships spec-0.8 tools; the patch floats per plugin release.
candorJavaVersion=0.12.0
candorTsVersion=0.12.0
